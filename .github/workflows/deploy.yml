name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pygbag
        run: pip install pygbag==0.8.6
        env:
          PYTHONUTF8: "1"

      - name: Build with pygbag
        run: pygbag --build --archive main.py

      - name: Upload itch.io archive
        uses: actions/upload-artifact@v4
        with:
          name: itch-io-snake-game
          path: ./build/web.zip

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
