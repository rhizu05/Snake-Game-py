name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare web build (index.html + game.js + resource)
        run: |
          mkdir -p web
          cp index.html game.js web/
          cp -r resource web/

      - name: Create itch.io archive
        run: |
          cd web
          zip -r ../itchio.zip .

      - name: Upload itch.io archive
        uses: actions/upload-artifact@v4
        with:
          name: itch-io-snake-game
          path: ./itchio.zip

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
